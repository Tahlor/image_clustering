name: Final repository reconciliation

on:
  push:
    branches: [agent/final-reconciliation]
    paths:
      - .reconcile/**

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply reconciled tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/final-reconciliation
          for part in 00 01 02 03; do
            git show "origin/agent/final-reconciliation:.reconcile/payload.part.${part}"
          done | base64 --decode | gzip --decompress > /tmp/final.patch
          echo "1b041397cc5040183be27b2749f628e193fca9279384618f6a9ed8e76b6820ad  /tmp/final.patch" | sha256sum --check
          git apply --index /tmp/final.patch
          git config user.name "Taylor Archibald"
          git config user.email "taylornarchibald@users.noreply.github.com"
          git commit -m "Reconcile evaluation and review workflow"

      - name: Validate
        run: |
          python -m pip install -q -e ".[dev]"
          python -m ruff check .
          python -m pytest -q

      - name: Publish master and remove extra branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:master
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/3" -f state=closed >/dev/null || true
          for branch in \
            agent/evaluate-1498-html \
            agent/sequence-cropper \
            agent/branch-reconciliation-audit \
            agent/final-reconciliation; do
            git push origin --delete "$branch" || true
          done
