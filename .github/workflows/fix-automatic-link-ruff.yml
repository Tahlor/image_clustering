name: Fix automatic-link Ruff line

on:
  push:
    branches: [agent/automatic-link-safety]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automatic-link-safety
      - name: Wrap assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_recall_first_occlusion.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert reason == "filename capture positions are too far apart for an automatic edge"\n'
          new = '''    assert reason == (\n        "filename capture positions are too far apart for an automatic edge"\n    )\n'''
          if old not in text:
              raise SystemExit('target assertion not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/fix-automatic-link-ruff.yml
          git config user.name "ChatGPT Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix automatic-link safety lint"
          git push origin HEAD:agent/automatic-link-safety
