name: Verify reviewed evaluator

on:
  push:
    branches:
      - agent/reviewed-200-real-gt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reviewed-200-real-gt
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Python 3.10 Ruff and pytest
        id: py310
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -q -e ".[dev]" 2>&1 | tee /tmp/python-3.10.log
          python -m ruff check . --output-format concise 2>&1 | tee -a /tmp/python-3.10.log
          python -m pytest -q 2>&1 | tee -a /tmp/python-3.10.log

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python 3.12 Ruff and pytest
        id: py312
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -q -e ".[dev]" 2>&1 | tee /tmp/python-3.12.log
          python -m ruff check . --output-format concise 2>&1 | tee -a /tmp/python-3.12.log
          python -m pytest -q 2>&1 | tee -a /tmp/python-3.12.log

      - name: Record result and clean workflow
        if: always()
        shell: bash
        env:
          PY310_OUTCOME: ${{ steps.py310.outcome }}
          PY312_OUTCOME: ${{ steps.py312.outcome }}
        run: |
          mkdir -p analysis/reviewed_real_occlusion
          {
            echo '# CI receipt'
            echo
            echo 'Generated by GitHub Actions on the pull-request branch.'
            echo
            echo "- Python 3.10 Ruff + complete pytest: ${PY310_OUTCOME}"
            echo "- Python 3.12 Ruff + complete pytest: ${PY312_OUTCOME}"
            echo "- Commit tested: $(git rev-parse HEAD)"
            echo
            echo 'The temporary verification workflow removed itself in this commit.'
          } > analysis/reviewed_real_occlusion/CI_RECEIPT.md
          cp /tmp/python-3.10.log analysis/reviewed_real_occlusion/ci-python-3.10.log
          cp /tmp/python-3.12.log analysis/reviewed_real_occlusion/ci-python-3.12.log
          rm .github/workflows/verify-reviewed-evaluator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record reviewed evaluator CI results'
          git push origin HEAD:agent/reviewed-200-real-gt
          test "${PY310_OUTCOME}" = success
          test "${PY312_OUTCOME}" = success
