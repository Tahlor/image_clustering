name: Export current master

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package repository source
        run: tar --exclude=.git -czf image-clustering-master.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: image-clustering-current-master
          path: image-clustering-master.tar.gz
