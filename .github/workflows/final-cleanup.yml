name: Final validation and branch cleanup

on:
  push:
    branches: [agent/final-reconciliation]
    paths:
      - .cleanup-trigger
  pull_request:
    branches: [master]
    paths:
      - .cleanup-trigger
      - .github/workflows/final-cleanup.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format and validate reconciled master
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -e ".[dev]"
          python -m ruff check . --fix
          if ! git diff --quiet; then
            git config user.name "Taylor Archibald"
            git config user.email "taylornarchibald@users.noreply.github.com"
            git add -A
            git commit -m "Apply final lint fixes"
            git push origin HEAD:master
          fi
          python -m ruff check .
          python -m pytest -q

      - name: Close temporary PRs and delete every non-master branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[].number' | while read -r number; do
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${number}" \
                -f state=closed >/dev/null || true
            done
          for branch in \
            agent/evaluate-1498-html \
            agent/sequence-cropper \
            agent/branch-reconciliation-audit \
            agent/final-reconciliation; do
            git push origin --delete "$branch" || true
          done
