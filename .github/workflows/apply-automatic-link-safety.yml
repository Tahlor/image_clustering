name: Apply automatic-link safety patch

on:
  push:
    branches: [agent/automatic-link-safety]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automatic-link-safety
      - name: Apply validated patch
        shell: bash
        run: |
          cat <<'PATCH_B64' | base64 -d | gzip -d > /tmp/automatic-link-safety.patch
          
          PATCH_B64
          patch --batch -p1 < /tmp/automatic-link-safety.patch
          rm .github/workflows/apply-automatic-link-safety.yml
          git config user.name "ChatGPT Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete automatic-link safety hardening"
          git push origin HEAD:agent/automatic-link-safety
