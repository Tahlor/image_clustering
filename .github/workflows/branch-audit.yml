name: Branch reconciliation audit

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/branch-audit.yml
      - scripts/branch_audit.py
  pull_request:
    branches: [master]
    paths:
      - .branch-audit-trigger
      - .github/workflows/branch-audit.yml
      - scripts/branch_audit.py

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inventory every branch
        run: python scripts/branch_audit.py --output_dir branch-audit

      - name: Upload branch audit
        uses: actions/upload-artifact@v4
        with:
          name: branch-reconciliation-audit
          path: branch-audit
          retention-days: 1
