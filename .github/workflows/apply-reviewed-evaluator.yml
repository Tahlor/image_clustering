name: Apply reviewed evaluator

on:
  push:
    branches:
      - agent/reviewed-200-real-gt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reviewed-200-real-gt
          fetch-depth: 0
      - name: Apply verified source bundle
        shell: bash
        run: |
          cat .github/patches/reviewed-evaluator.part* > /tmp/reviewed_evaluator_patch.b64
          base64 -d /tmp/reviewed_evaluator_patch.b64 > /tmp/reviewed_evaluator_patch.tgz
          echo '4f777655fc709af8381b0187afe7ce48dd76c446bffd3e5c47c10823ac137708  /tmp/reviewed_evaluator_patch.tgz' | sha256sum -c -
          tar -xzf /tmp/reviewed_evaluator_patch.tgz
          python -m pip install -e '.[dev]'
          python -m ruff check .
          python -m pytest -q tests/test_reviewed_groups.py
          rm -rf .github/patches .github/workflows/apply-reviewed-evaluator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add grouped reviewed-real occlusion evaluation'
          git push origin HEAD:agent/reviewed-200-real-gt
