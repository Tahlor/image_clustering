name: Cleanup material triplet branch

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Delete merged working branch
        run: git push origin --delete agent/bridge-material-occlusion-triplets || true
