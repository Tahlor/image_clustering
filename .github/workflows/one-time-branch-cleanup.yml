name: One-time branch cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/one-time-branch-cleanup.yml

permissions:
  contents: write

jobs:
  delete-non-master-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except master
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t branches < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
              --jq '.[].name'
          )

          for branch in "${branches[@]}"; do
            if [[ "$branch" == "master" ]]; then
              continue
            fi
            echo "Deleting branch: $branch"
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done

          remaining="$({
            gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
              --jq '.[].name'
          } | sort)"

          echo "Remaining branches:"
          printf '%s\n' "$remaining"

          if [[ "$remaining" != "master" ]]; then
            echo "Expected exactly one branch named master." >&2
            exit 1
          fi
