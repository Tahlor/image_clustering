name: Apply bounded ECC branch patch

on:
  pull_request_target:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/automatic-link-safety' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automatic-link-safety
      - name: Apply patch helper
        run: |
          python scripts/apply_bounded_ecc_patch.py
          rm -f scripts/apply_bounded_ecc_patch.py
          rm -f .github/workflows/apply-bounded-ecc.yml
          git config user.name "ChatGPT Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Bound and serialize ECC fallback runtime"
          git push origin HEAD:agent/automatic-link-safety
