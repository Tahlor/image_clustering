name: Cleanup recall-first branch

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete merged working branch
        run: git push origin --delete agent/recall-first-occlusion-score || true
