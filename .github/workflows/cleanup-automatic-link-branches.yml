name: Cleanup automatic-link working branches

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Delete merged working branches
        run: |
          git push origin --delete agent/automatic-link-safety || true
          git push origin --delete agent/automatic-link-safety-temp || true
